---
# ----------------------------------------------------------------------------------------
# -- Spark standalone training cluster.
# -- Resource profiles live in ./profiles/*.env and are passed with --env-file.
# ----------------------------------------------------------------------------------------
x-workspace: &workspace
  - ./build/workspace:/opt/workspace

x-spark-worker-env: &spark-worker-env
  SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
  SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
  SPARK_WORKER_OPTS: ${SPARK_WORKER_OPTS:-}

services:
  jupyterlab:
    build:
      context: .
      dockerfile: build/docker/jupyterlab-local/Dockerfile
      args:
        SPARK_VERSION: ${SPARK_VERSION:-3.5.7}
        JUPYTERLAB_VERSION: ${JUPYTERLAB_VERSION:-4.4.10}
    image: ${JUPYTERLAB_IMAGE:-halltape/jupyterlab-spark:3.5.7}
    container_name: jupyterlab
    ports:
      - "${JUPYTERLAB_PORT:-8888}:8888"
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
    volumes: *workspace
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    command: >
      jupyter lab
      --ip='*'
      --allow-root
      --no-browser
      --ServerApp.token=''
      --ServerApp.password=''
      --MappingKernelManager.kernel_info_timeout=180
      --ServerApp.websocket_ping_interval=180
      --ServerApp.websocket_ping_timeout=180
    depends_on:
      - spark-master

  spark-master:
    image: ${SPARK_MASTER_IMAGE:-andreper/spark-master:latest}
    container_name: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes: *workspace

  spark-worker:
    image: ${SPARK_WORKER_IMAGE:-andreper/spark-worker:latest}
    environment: *spark-worker-env
    volumes: *workspace
    command: >
      bash -lc "bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores $${SPARK_WORKER_CORES}
      --memory $${SPARK_WORKER_MEMORY}
      >> logs/spark-worker.out"
    depends_on:
      - spark-master
